services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deep-research-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_agent_system
    ports:
      - "5433:5432"   # host 5433 → container 5432 (5432 taken by another container)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_agent_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
